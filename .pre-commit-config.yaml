repos:
  # YAML validation
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Prettier YAML
        types: [yaml]
        files: \.github/.*\.ya?ml$
        args: [--parser=yaml, --tab-width=2]

  # Markdown linting (Python-based)
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.18
    hooks:
      - id: pymarkdown
        name: PyMarkdown Linter
        files: \.md$
        args: [--config=.pymarkdown.json, scan]

  # Spell checking
  - repo: https://github.com/crate-ci/typos
    rev: v1.16.26
    hooks:
      - id: typos
        name: Spell Checker
        files: \.(md|txt|yaml|yml|go)$
        args: [--config, .typos.toml]

  # JSON validation
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Prettier JSON
        types: [json]
        files: \.json$

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scanner

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        files: \.(md|txt|yaml|yml|go|json)$
      - id: end-of-file-fixer
        name: Fix End of Files
        files: \.(md|txt|yaml|yml|go|json)$
      - id: check-yaml
        name: Check YAML Syntax
        files: \.ya?ml$
      - id: check-json
        name: Check JSON Syntax
        files: \.json$
      - id: check-merge-conflict
        name: Check for Merge Conflicts
      - id: check-added-large-files
        name: Check for Large Files
        args: [--maxkb=1000]
        exclude: '\.pymarkdown\.json$'
      - id: check-case-conflict
        name: Check for Case Conflicts
      - id: mixed-line-ending
        name: Mixed Line Ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
        name: Check Executables Have Shebangs
      - id: check-shebang-scripts-are-executable
        name: Check Shebang Scripts Are Executable
      - id: check-symlinks
        name: Check Symlinks
      - id: detect-private-key
        name: Detect Private Keys

  # Repository contract checks
  - repo: local
    hooks:
      - id: bash-syntax
        name: Check Bash syntax
        entry: bash -n
        language: system
        types: [shell]
      - id: virtualboard-validate
        name: Validate VirtualBoard features and specs
        entry: ./.state/bin/vb --root . validate
        language: system
        pass_filenames: false
        files: ^(features|specs|schemas|templates)/
      - id: automation-contract-tests
        name: Run automation contract tests
        entry: bash tests/run.sh
        language: system
        pass_filenames: false
        files: ^(agents/|prompts/|skills/|plugins/|scripts/|tests/|tools/|schemas/|templates/|docs/|\.claude-plugin/|\.github/|\.vb-version$|\.vb-cli-source-ref$|virtualboard\.json$)
