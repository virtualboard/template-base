name: Release template

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: template-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.0"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli-source-ref: ${{ steps.cli-ref.outputs.ref }}
    steps:
      - name: Check out the tagged template
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an exact tagged and reviewed template version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < version.txt)"
          TAG_COMMIT=$(git rev-parse HEAD)
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          git fetch --force --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "release source is on origin/main"
          elif git fetch --force --no-tags origin \
            "refs/heads/release/${RELEASE_TAG}:refs/remotes/origin/release/${RELEASE_TAG}" && \
            test "$TAG_COMMIT" = "$(git rev-parse "refs/remotes/origin/release/${RELEASE_TAG}")"; then
            echo "release source is the exact head of release/${RELEASE_TAG}"
          else
            echo "release tag must be on origin/main or the exact release/${RELEASE_TAG} head" >&2
            exit 1
          fi

      - name: Require a concrete exact CLI source candidate
        id: cli-ref
        run: |
          SOURCE_REF=$(tr -d '[:space:]' < .vb-cli-source-ref)
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_REF" != 0000000000000000000000000000000000000000
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  package:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the verified tag without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the stable template archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ARCHIVE="template-base-${RELEASE_TAG}.zip"
          mkdir -p dist
          git archive --format=zip --prefix="template-base-${RELEASE_TAG}/" \
            --output="dist/$ARCHIVE" "$GITHUB_SHA"
          cd dist
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          sha256sum "$ARCHIVE" > template-checksums.txt
          test "$(wc -l < template-checksums.txt | tr -d ' ')" = 1

      - name: Stage the verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: template-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/template-base-${{ github.ref_name }}.zip
            dist/template-checksums.txt
          if-no-files-found: error
          retention-days: 1

  full-verification:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  artifact-verification:
    needs: [preflight, package, full-verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tagged template without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out the exact CLI source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: virtualboard/vb-cli
          ref: ${{ needs.preflight.outputs.cli-source-ref }}
          path: .state/vb-cli-source
          persist-credentials: false

      - name: Set up exact Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: .state/vb-cli-source/go.sum

      - name: Retrieve the exact release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: template-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - name: Build the source-pinned CLI and exercise the published bytes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(go env GOVERSION)" = "go${GO_VERSION}"
          ARCHIVE="dist/template-base-${RELEASE_TAG}.zip"
          EXPECTED=$(awk -v asset="template-base-${RELEASE_TAG}.zip" \
            '$2 == asset || $2 == "*" asset { print $1 }' dist/template-checksums.txt)
          test "$(sha256sum "$ARCHIVE" | awk '{print $1}')" = "$EXPECTED"
          GO=go scripts/build-vb-cli-candidate.sh \
            .state/vb-cli-source "$ARCHIVE" .state/bin/vb
          .state/vb-cli-source/scripts/release-smoke.sh \
            .state/bin/vb "$ARCHIVE" "$RELEASE_TAG"

  attest:
    needs: artifact-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Retrieve the verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: template-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - name: Attest template-release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

  publisher-tool:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed release publisher without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test and stage the source-bound draft publisher
        run: |
          python3 -m unittest tests/test_release_publisher.py -v
          install -m 0555 scripts/publish_github_release.py \
            "$RUNNER_TEMP/publish_github_release.py"

      - name: Upload the immutable publisher tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publisher-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish_github_release.py
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [attest, publisher-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - name: Retrieve the attested release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: template-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - name: Retrieve the tested release publisher
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-publisher-${{ github.sha }}-${{ github.run_attempt }}
          path: release-publisher

      - name: Require the complete release payload
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s "dist/template-base-${RELEASE_TAG}.zip"
          test -s dist/template-checksums.txt
          test -s release-publisher/publish_github_release.py

      - name: Verify a source-bound draft before atomic publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 release-publisher/publish_github_release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --source-sha "$GITHUB_SHA" \
            --title "VirtualBoard template ${RELEASE_TAG}" \
            --asset "dist/template-base-${RELEASE_TAG}.zip" \
            --asset dist/template-checksums.txt
